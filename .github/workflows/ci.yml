name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # CGO_ENABLED=0 is the point of this project, so the matrix proves it.
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
      - run: go test -race ./...

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # A cgo-bound server cannot do this without a toolchain per target.
      - run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/starlsp || exit 1
            echo "built $target"
          done
