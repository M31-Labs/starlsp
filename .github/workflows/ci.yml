name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # CGO_ENABLED=0 is the point of this project, so the matrix proves it.
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
      - run: go test -race ./...
      # The lean build embeds one grammar instead of 200-odd. It must keep
      # passing, or the size claim in the README quietly stops being true.
      - run: go test -tags 'grammar_subset,grammar_subset_starlark' ./...

  realworld:
    # The corpus gate. Every file in a released Bazel or Tilt repository parses
    # for the tool that consumes it, so a diagnostic here is this server's bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Fetch real Starlark
        run: |
          mkdir -p /tmp/corpus
          git clone --depth 1 https://github.com/bazelbuild/rules_go /tmp/corpus/rules_go
          git clone --depth 1 https://github.com/bazelbuild/bazel-skylib /tmp/corpus/bazel-skylib
          git clone --depth 1 https://github.com/tilt-dev/tilt /tmp/corpus/tilt
      - name: Survive, and report nothing false
        env:
          GTS_STARLARK_CORPUS: /tmp/corpus
        run: go test -run TestCorpus -timeout 900s ./...
      - name: Zero errors under the matching dialect
        run: |
          go build -o /tmp/starlsp ./cmd/starlsp
          bazel_errors=$(find /tmp/corpus \( -name '*.bzl' -o -name BUILD -o -name BUILD.bazel -o -name WORKSPACE \) -type f -print0 \
            | xargs -0 /tmp/starlsp --dialect bazel --check 2>/dev/null | grep -c ': error:' || true)
          tilt_errors=$(find /tmp/corpus -name Tiltfile -type f -print0 \
            | xargs -0 /tmp/starlsp --dialect tilt --check 2>/dev/null | grep -c ': error:' || true)
          echo "bazel: $bazel_errors errors, tilt: $tilt_errors errors"
          if [ "$bazel_errors" -ne 0 ] || [ "$tilt_errors" -ne 0 ]; then
            echo "::error::the server reports errors on real-world Starlark"
            exit 1
          fi

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # A cgo-bound server cannot do this without a toolchain per target.
      - run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/starlsp || exit 1
            echo "built $target"
          done
